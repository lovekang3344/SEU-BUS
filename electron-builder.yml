# electron-builder config (Windows-focused; macOS/Linux can be added later).
# Docs: https://www.electron.build/configuration

appId: com.zai.cubepet
productName: Cube Pet Desktop
copyright: Copyright © 2025 Z.ai

directories:
  output: release
  buildResources: build

# The compiled Electron main/preload (from tsconfig.electron.json -> dist-electron)
# and the statically-exported frontend (out/). NO node_modules needed at runtime
# because the frontend is pre-built and the main process uses only Electron APIs.
files:
  - dist-electron/**/*
  - out/**/*
  - package.json
  - "!**/node_modules/**"
  - "!**/.DS_Store"
  - "!**/*.{md,markdown}"
  - "!**/.{idea,git,cache,vscode,DS_Store}"

# Make sure out/ is packed into asar (not unpacked) so app:// can read it.
asar: true

# Bundle keepAlive.ps1 + time.json so the main process can read them via
# process.resourcesPath/data/...
extraResources:
  - from: data/
    to: data/
    filter: ["**/*"]
  - from: build/
    to: build/
    filter: ["icon.png", "icon.ico"]

# Windows installer (NSIS — recommended over MSI for smaller size + better UX)
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  # Sign later; unsigned is fine for personal/internal use.
  # certificateFile: ""
  # certificatePassword: ""

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Cube Pet
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico

# Portable is handy for testing without install.
# Uncomment to also produce a no-install .exe:
# portable:
#   artifactName: CubePet-Portable-${version}.exe
