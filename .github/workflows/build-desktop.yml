# Build & publish the Electron desktop app to GitHub Releases.
# Triggers on tags matching `desktop-v*` (e.g. desktop-v0.1.0).
# Runs on windows-latest, builds the NSIS installer, attaches it to a Release.
name: Desktop Release

on:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write   # needed by softprops/action-gh-release to create the release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node (for electron-builder fallback)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: bun install

      - name: Build & package (Next export + tsc + electron-builder)
        run: bun run electron:build
        env:
          # electron-builder reads these; GH_TOKEN enables the release upload.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts (for debugging if release fails)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: |
            release/
            out/
            dist-electron/
          if-no-files-found: ignore
          retention-days: 7

      - name: Extract version from tag
        id: ver
        shell: bash
        run: |
          # tag like "desktop-v0.1.0" -> version "0.1.0"
          TAG="${GITHUB_REF_NAME#desktop-v}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "Extracted version: $TAG"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Desktop ${{ steps.ver.outputs.version }}
          tag_name: ${{ github.ref_name }}
          target_commitish: desktop
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.msi
            release/**/*.exe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
